  commit: 556128999c2f44110752a32fbfc925275169b3e5
  command: "weekend-amqp-5.14.3.sh's build: mvn -B -P!setup-test-cluster -Dit.test=ClientTests,SSLTests clean verify against a RabbitMQ broker on localhost with TLS on 5671, failures ignored; the report decides"
  runtime: OpenJDK 1.8.0_382 (Zulu 8.72.0.17, linux-aarch64), Apache Maven 3.9.16, RabbitMQ 3.12.1 (Ubuntu 24.04 package, node rabbit@localhost, TLS on 5671 with test certificates) on a Linux aarch64 devpod
  report: amqp-client-5.14.3.1-backpatch-00009-tests.zip
  report_sha256: 1c33eb7765ccf63bb9605366da93c98630ebdb4da402eb460a88975f8b2bfe08
  result: pass
  note: "265 tests at the patch commit, 3 of them skipped by the suite, 0 failed, 0 errors. ClientTests and SSLTests ran on a Linux aarch64 devpod against Ubuntu's rabbitmq-server, rabbitmqctl at its native path, TLS on 5671 with test certificates made there (a CA, a server certificate for localhost, a client keycert.p12); the baseline 5.14.3 ran there too: 215 tests, 0 red. SSLTests skips VerifiedConnection, BadVerifiedConnection and HostnameVerification on Java 8 by its own condition (it expects Java 11), at the baseline too."
